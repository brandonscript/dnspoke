name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[lint]'
      - run: pre-commit validate-config
      - run: ruff check dnspoke/admin.py dnspoke/admin_dns.py tests/test_admin_dns.py
      - run: ruff format --check dnspoke/admin.py dnspoke/admin_dns.py tests/test_admin_dns.py
  server:
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[server,test,typecheck]'
      - run: python -m mypy
      - run: python -m pytest -q
      - name: Install client with shell script
        run: |
          sh install.sh --source "$PWD" --prefix "$RUNNER_TEMP/dnspoke install" --python "$(command -v python)"
          "$RUNNER_TEMP/dnspoke install/bin/dnspoke" --help
          sh install.sh --source "$PWD" --prefix "$RUNNER_TEMP/dnspoke install" --python "$(command -v python)"
  windows-client:
    strategy:
      matrix:
        python: ['3.12', '3.14']
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q tests/test_client.py tests/test_storage.py tests/test_end_to_end.py tests/test_help.py
      - name: Install client with Windows PowerShell
        shell: powershell
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'dnspoke install'
          .\install.ps1 -Source $PWD.Path -Python (Get-Command python).Source -InstallDir $directory -NoPath
          & (Join-Path $directory 'bin\dnspoke.cmd') --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed' }
          .\install.ps1 -Source $PWD.Path -Python (Get-Command python).Source -InstallDir $directory -NoPath
